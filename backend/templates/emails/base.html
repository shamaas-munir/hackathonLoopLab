<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ExamSlot{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#F4F7FB;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#1E2A3B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F7FB;padding:24px 12px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #DCE5F0;">
      <tr><td style="background:#3B6FD4;padding:20px 28px;color:#ffffff;font-size:18px;font-weight:700;">
        Virtual University &middot; ExamSlot
      </td></tr>
      <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
        {% block content %}{% endblock %}
      </td></tr>
      <tr><td style="padding:16px 28px;background:#EEF3FA;color:#5B6B80;font-size:12px;line-height:1.5;">
        This is an automated message from the ExamSlot portal. If you didn't expect it, you can ignore it.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
