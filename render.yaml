# Render blueprint: ExamSlot backend (Django + DRF). Frontend is on Vercel (root directory `web/`).
# Secrets use `sync: false`, so Render asks for them when the blueprint is created.
services:
  - type: web
    name: examslot-api
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/health/
    buildCommand: pip install uv && uv sync --frozen && uv run python manage.py collectstatic --noinput && uv run python manage.py migrate
    startCommand: uv run gunicorn config.wsgi:application --workers 2 --threads 4 --bind 0.0.0.0:$PORT --keep-alive 75 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "True"
      - key: DATABASE_URL # Neon connection string, with ?sslmode=require
        sync: false
      - key: ALLOWED_HOSTS # e.g. examslot-api.onrender.com
        sync: false
      - key: FRONTEND_URL # e.g. https://examslot.vercel.app (used in emailed links)
        sync: false
      - key: CSRF_TRUSTED_ORIGINS # e.g. https://examslot.vercel.app,https://examslot-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS # e.g. https://examslot.vercel.app
        sync: false
      - key: EMAIL_HOST # Gmail SMTP: smtp.gmail.com (or leave empty and set RESEND_API_KEY)
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER # the Gmail address
        sync: false
      - key: EMAIL_HOST_PASSWORD # 16-letter Gmail app password
        sync: false
      - key: MAIL_FROM # e.g. ExamSlot <you@gmail.com>
        sync: false
      - key: REDIS_URL # Upstash rediss://default:<token>@<host>.upstash.io:6379 (shared cache + rate limits)
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
